<h1>簽名</h1>
<p class="summary">為每個帳戶的新郵件、回覆和轉寄郵件加上簽名。</p>
<p>若要加上簽名：</p>
<ol>
    <li>選擇<b data-text="menu-file"></b> &gt; <b data-text="cmd-accounts"></b>。</li>
    <li>選取帳戶，然後按一下<!--os:windows--><b data-text="win-signature-button"></b><!--/os--><!--os:mac--><b data-text="mac-signature-button"></b><!--/os--><!--os:linux--><b data-text="gtk-accounts-signature"></b><!--/os-->。</li>
    <li>撰寫簽名。您可以像設定郵件格式一樣設定它的格式，使用粗體、色彩、連結和圖片。</li>
    <li>按一下<b data-text="ui-ok"></b>。</li>
</ol>
<p>之後，從該帳戶寄出的新郵件、回覆和轉寄郵件都會包含這段簽名文字。它位於一個供您撰寫的空白行和常見的 <code>--</code> 分隔行之下，並在引用的郵件之上。</p>
<p>當您在<b data-text="ui-field-from"></b>中選擇其他帳戶時，該帳戶的簽名會取代原本的簽名。</p>
<p>若要移除簽名，請再次開啟它，刪除其中的文字，然後按一下<b data-text="ui-ok"></b>。</p>

<h1>签名</h1>
<p class="summary">为每个帐户的新邮件、答复和转发添加签名。</p>
<p>要添加签名，请：</p>
<ol>
    <li>选择<b data-text="menu-file"></b> &gt; <b data-text="cmd-accounts"></b>。</li>
    <li>选择帐户并单击<!--os:windows--><b data-text="win-signature-button"></b><!--/os--><!--os:mac--><b data-text="mac-signature-button"></b><!--/os--><!--os:linux--><b data-text="gtk-accounts-signature"></b><!--/os-->。</li>
    <li>撰写签名。您可以像设置邮件格式那样设置签名的格式，使用加粗、颜色、链接和图片。</li>
    <li>单击<b data-text="ui-ok"></b>。</li>
</ol>
<p>此后，从该帐户发出的新邮件、答复和转发都会包含这段签名。签名位于一个供您书写的空行和惯用的 <code>--</code> 行之下，并位于引用的邮件之上。</p>
<p>当您在<b data-text="ui-field-from"></b>中选择另一个帐户时，该帐户的签名会替换原来的签名。</p>
<p>要删除签名，请再次打开它，删除其中的文字，然后单击<b data-text="ui-ok"></b>。</p>

language = "C"
include_guard = "INBOX_CLASSIC_H"
cpp_compat = true
usize_is_size_t = true
header = "// The C API of the Inbox Classic core, the only way the C++ app talks to the Rust code"
autogen_warning = "// Generated by cbindgen from core/crates/pe-ffi, do not edit. Rebuild the crate to update it."
documentation_style = "c99"

[enum]
# PE_FAILURE_KIND_NONE: C enum constants share one namespace, and Windows headers define words like None
rename_variants = "QualifiedScreamingSnakeCase"

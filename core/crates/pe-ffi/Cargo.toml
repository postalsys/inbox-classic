[package]
name = "pe-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# staticlib is what the C++ app links (pe_ffi.lib), lib lets the tests of this crate call the exports
[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
pe-autoconfig = { path = "../pe-autoconfig" }
pe-core = { path = "../pe-core" }
pe-html.workspace = true
pe-imap = { path = "../pe-imap" }
pe-net.workspace = true
pe-oauth = { path = "../pe-oauth" }
pe-store = { path = "../pe-store" }

[dev-dependencies]
base64.workspace = true
pe-testkit = { path = "../pe-testkit" }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

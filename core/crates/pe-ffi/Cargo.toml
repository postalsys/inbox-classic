[package]
name = "pe-ffi"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# staticlib is what the C++ app links (pe_ffi.lib), lib lets the tests of this crate call the exports
[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
pe-autoconfig = { path = "../pe-autoconfig" }
pe-core = { path = "../pe-core" }
pe-html.workspace = true
pe-imap = { path = "../pe-imap" }
pe-net.workspace = true
pe-oauth = { path = "../pe-oauth" }
pe-store = { path = "../pe-store" }
pe-mcp = { path = "../pe-mcp" }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

# the named pipe agents reach the app on, open to this user alone, and the program that started the relay
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
base64.workspace = true
pe-testkit = { path = "../pe-testkit" }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"
# core/commands.toml
serde = { version = "1", features = ["derive"] }
toml = "0.9"

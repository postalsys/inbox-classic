[package]
name = "pe-core"
description = "The mail engine behind the C API: accounts, their sync workers, the message list and message views"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
pe-autoconfig = { path = "../pe-autoconfig" }
pe-content = { path = "../pe-content" }
pe-html.workspace = true
pe-imap = { path = "../pe-imap" }
pe-mime.workspace = true
pe-net.workspace = true
pe-oauth = { path = "../pe-oauth" }
pe-smtp = { path = "../pe-smtp" }
pe-store = { path = "../pe-store" }
pe-sync = { path = "../pe-sync" }
# BIMI logos (SVG Tiny PS) to pixels: no text (no system fonts read), no raster images
resvg = { version = "0.49", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
keyring-core = "1.0.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

# the login keychain
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

# the Secret Service (GNOME Keyring) over D-Bus, pure Rust (zbus on its own async-io thread, so the blocking calls work inside the tokio runtime too), no libdbus
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
base64.workspace = true
pe-testkit = { path = "../pe-testkit" }
serde_json = "1"

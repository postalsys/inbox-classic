[package]
name = "pe-core"
description = "The mail engine behind the C API: accounts, their sync workers, the message list and message views"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pe-autoconfig = { path = "../pe-autoconfig" }
pe-content = { path = "../pe-content" }
pe-html.workspace = true
pe-imap = { path = "../pe-imap" }
pe-mime.workspace = true
pe-net.workspace = true
pe-oauth = { path = "../pe-oauth" }
pe-smtp = { path = "../pe-smtp" }
pe-store = { path = "../pe-store" }
pe-sync = { path = "../pe-sync" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
base64.workspace = true
pe-testkit = { path = "../pe-testkit" }
serde_json = "1"

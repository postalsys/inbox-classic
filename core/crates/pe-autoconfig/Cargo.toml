[package]
name = "pe-autoconfig"
description = "Finds the IMAP and SMTP servers of an e-mail address the way Thunderbird does"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
idna = "1.1.0"
pe-net.workspace = true
quick-xml = "0.42.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

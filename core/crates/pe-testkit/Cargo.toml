[package]
name = "pe-testkit"
description = "Test support: starts ImapKit (core/e2e) for end-to-end tests and talks to its REST API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pe-imap = { path = "../pe-imap" }
pe-net.workspace = true
pe-store = { path = "../pe-store" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["time", "sync"] }

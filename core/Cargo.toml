[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.dependencies]
base64 = "0.22"
getrandom = "0.4"
encoding_rs = "0.8"
pe-mime = { path = "crates/pe-mime" }
pe-net = { path = "crates/pe-net" }
ammonia = "4"
pe-html = { path = "crates/pe-html" }

[profile.release]
lto = "thin"
codegen-units = 1

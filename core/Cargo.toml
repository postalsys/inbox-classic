[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.dependencies]
base64 = "0.22"
getrandom = "0.4"
encoding_rs = "0.8"
pe-mime = { path = "crates/pe-mime" }
pe-net = { path = "crates/pe-net" }
ammonia = "4"
pe-html = { path = "crates/pe-html" }
pe-jsre = { path = "crates/pe-jsre" }
pe-i18n = { path = "crates/pe-i18n" }

[profile.release]
lto = "thin"
codegen-units = 1

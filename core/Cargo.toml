[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.dependencies]
base64 = "0.22"
getrandom = "0.4"
encoding_rs = "0.8"
pe-mime = { path = "crates/pe-mime" }
pe-net = { path = "crates/pe-net" }
ammonia = "4"
pe-html = { path = "crates/pe-html" }
pe-jsre = { path = "crates/pe-jsre" }
pe-i18n = { path = "crates/pe-i18n" }

[profile.release]
lto = "thin"
codegen-units = 1

# a passphrase sealed with Argon2 (pe-pgp sealed.rs) derives 64 MiB: unoptimized, each test that opens one takes seconds
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# the preview meter inflates up to 160 MB of a hostile PDF stream to count it: unoptimized, the tests take seconds
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

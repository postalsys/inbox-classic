# Every command of the main window, once for the three platforms. pe-ffi's build.rs turns it into
#   core/include/commands.h          the IDM_ ids of the Windows app (app/src/app.h includes it)
#   mac/Sources/Generated/Commands.swift   the Mac's Command enum with its menu, label and key
#   linux/src/generated/commands.rs  the Linux Command enum with its action name, label and accelerator
# All three are committed and CI checks they match this file. Each window handles the enum in one exhaustive switch
# or match, so a command added here fails the build of a platform that does not handle it yet.
#
#   id       the name in code (snake_case here, IDM_NEW_ACCOUNT in C, newAccount in Swift, NewAccount in Rust)
#   windows  the Win32 command id, which scripts/ui-e2e.ps1 posts as the menu would
#   menu     file, edit, view, tools, message, help, or tray (the tray icon's menu only)
#   (label)  not here: the catalog's cmd-<id> in core/locales/en/app.ftl, in every language, & marking the menu letter
#   key      the shortcut: Mod is Ctrl on Windows and Linux and Command on the Mac; Shift, Alt (Option on the Mac);
#            a letter, F1 to F12, Enter, Delete. mac and linux override it where those platforms differ.
#   toggle   a menu item with a check mark
#   one      acts on one message only: off while several are selected
#   some     acts on one or several messages: off with none selected


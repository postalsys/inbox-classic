# The settings window, once for the three platforms: its pages, their groups and their settings, in the order every
# platform shows them (Windows' Tools > Options, the Mac's Inbox Classic > Settings, Linux's Main Menu > Preferences).
# pe-ffi's build.rs turns it into
#   core/include/settings.h                               the tables of the Windows app (app/src/options.cpp)
#   mac/Sources/InboxClassic/Generated/SettingsPages.swift  the Mac's SettingsPage, SettingsGroup and Setting enums
#   linux/src/generated/settings_pages.rs                 the same for Linux
# All three are committed and CI checks they match this file. Each app lays out the pages and groups from them and
# builds each setting in one exhaustive switch or match, so a setting added here fails the build of a platform that
# does not show it yet, and the three orders cannot drift apart. The help names a page with
# <b data-settings="reading"></b> (pe-html help.rs reads the pages from here too).
#
# [[page]]          a page: a tab on Windows, a toolbar pane on the Mac, an AdwPreferencesPage on Linux
#   id              the name in code and in the help's data-settings
#   label           its catalog message: the tab, the pane's toolbar item and window title, the view switcher
#   mac_symbol      the SF Symbol of its toolbar item on the Mac
#   linux_icon      the icon of its view switcher button on Linux
# [[page.group]]    a group of the page: a group box on Windows, set apart by space on the Mac (its title with a colon
#                   in the label column, on its first control's row, unless that is a pop-up with a label of its
#                   own, as Apple's own panes), an AdwPreferencesGroup on Linux
#   id              the name in code
#   label           its title, a heading of its own (no access key, no colon, never a field's label); none for the
#                   one group of a page, which the page titles
#                   (a group shows on the platforms that have one of its settings)
#   note            a note under the group (Linux: its description)
# [[page.group.setting]]
#   id              the name in code (snake_case here, PE_SETTING_SEND_DELAY in C, sendDelay in Swift, SendDelay in
#                   Rust)
#   kind            switch (a check box, AdwSwitchRow), choice (a list, pop-up or combo row with its label), button
#                   (opens a window or acts at once), status (a line of state the core words, with its label: a
#                   static text, a label in the content column, an AdwActionRow's subtitle)
#   label           its catalog message; & marks its Windows access key, unique within its page with OK, Cancel and
#                   Apply in every language (pe-ffi tests/settings.rs)
#   note            a note under it (Linux: the row's subtitle or the group's description)
#   platforms       the platforms that have it, all three when left out
#   depends_on      a switch before it in its group: this one is disabled while that one is off

[[page]]
id = "general"
label = "ui-settings-general"
mac_symbol = "gearshape"
linux_icon = "emblem-system-symbolic"

[[page.group]]

[package]
name = "inbox-classic"
description = "A fast, simple mail program: IMAP, SMTP and MIME in a Rust core, a GTK 4 window"
version = "0.14.0" # x-release-please-version
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
authors = ["Postal Systems OÜ <info@postalsys.com>"]
homepage = "https://inboxclassic.com"
repository = "https://github.com/postalsys/inbox-classic"

# its own workspace, so `cargo test --workspace` in core/ (on the Mac and Windows too) never builds GTK
[workspace]

[dependencies]
pe-autoconfig = { path = "../core/crates/pe-autoconfig" }
pe-core = { path = "../core/crates/pe-core" }
pe-html = { path = "../core/crates/pe-html" }
pe-imap = { path = "../core/crates/pe-imap" }
pe-mcp = { path = "../core/crates/pe-mcp" }
pe-net = { path = "../core/crates/pe-net" }
pe-oauth = { path = "../core/crates/pe-oauth" }
pe-store = { path = "../core/crates/pe-store" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
webkit = { package = "webkit6", version = "0.6" }
# the tray icon (StatusNotifierItem, which Ubuntu's AppIndicator extension shows)
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# the unread count on the dock (com.canonical.Unity.LauncherEntry)
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# the core's events from its worker threads to the window thread, and a request's answer to the window waiting
async-channel = "2"
futures-channel = "0.3"
# Hyprland's list of windows (hyprland.rs) and the e2e driver's checks over ImapKit's REST API
serde_json = "1"
base64 = { version = "0.22", optional = true }

[build-dependencies]
glib-build-tools = "0.22"

[features]
# the in-process driver of the UI end-to-end test (scripts/linux-ui-e2e.sh); never in a release
e2e = ["dep:base64"]

# the .deb (scripts/linux-package.sh, cargo-deb): the libraries it needs come from dpkg-shlibdeps
[package.metadata.deb]
name = "inbox-classic"
maintainer = "Postal Systems OÜ <info@postalsys.com>"
copyright = "2026, Postal Systems OÜ"
license-file = ["../LICENSE", "0"]
extended-description = """\
Inbox Classic reads and writes e-mail with the folders on the left, the messages at the top and the message below. \
IMAP, SMTP and MIME run in a Rust core; messages are shown sanitized, without scripts."""
section = "mail"
priority = "optional"
depends = "$auto"
recommends = "gnome-keyring"
assets = [
    ["target/release/inbox-classic", "usr/bin/", "755"],
    ["data/com.inboxclassic.InboxClassic.desktop", "usr/share/applications/", "644"],
    ["data/com.inboxclassic.InboxClassic.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../app/res/app-icon.svg", "usr/share/icons/hicolor/scalable/apps/com.inboxclassic.InboxClassic.svg", "644"],
    ["../build/linux-notices/THIRD-PARTY-NOTICES.txt", "usr/share/doc/inbox-classic/", "644"],
    # the help for Yelp (examples/yelp-help.rs), /usr/share/help/<language>/inbox-classic/
    ["../build/linux-help/**/*", "usr/share/help/", "644"],
    # the apt source of apt.inboxclassic.com, with the release key in it, which debian/postinst installs
    ["data/inboxclassic.sources", "usr/share/inbox-classic/", "644"],
]
# postinst adds the apt repository, postrm removes it on purge
maintainer-scripts = "debian/"

[profile.release]
lto = "thin"
codegen-units = 1

name: CI

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Rust formatting and lints
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets --locked -- -D warnings
            # the C header is generated by the build, a stale committed copy fails here
            - name: C header is up to date
              run: git diff --exit-code -- include

    test:
        name: Rust tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - run: cargo test --workspace --locked

    windows:
        name: Build the Windows app
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core -> ../build/cargo
            - name: Build
              shell: cmd
              run: scripts\win-build.cmd
            - uses: actions/upload-artifact@v7
              with:
                  name: PostalExpress-win-x64
                  path: build/PostalExpress.exe
                  if-no-files-found: error

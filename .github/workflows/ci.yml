name: CI

on:
    push:
        branches:
            - master
    pull_request:
        # labelled too, so the shells check sees a "shells: partial" label added after the push
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Rust formatting and lints
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets --locked -- -D warnings
            # the C header and the command tables of the three apps (core/commands.toml) are generated by the build,
            # a stale committed copy fails here
            - name: Generated files are up to date
              run: git diff --exit-code -- include ../mac/Sources/InboxClassic/Generated ../linux/src/generated

    translations:
        name: New translations marked for review
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            # a translated message or help passage that is new or changed since core/locales/REVIEWED carries a review
            # mark, so the drafts can be found and reviewed later
            - run: node scripts/i18n-review.mjs --check

    shells:
        name: Every app changed with what they share
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - run: scripts/check-shells.sh "origin/${{ github.base_ref }}" "${{ join(github.event.pull_request.labels.*.name, ',') }}"

    test:
        name: Rust tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core
        env:
            # the end-to-end tests against ImapKit must run here, not skip
            PE_E2E_REQUIRED: '1'
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: core/e2e/package-lock.json
            - name: ImapKit for the end-to-end tests
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            - run: cargo test --workspace --locked
              env:
                  # the autoconfig lookups against the real ISPDB and providers, once is enough
                  PE_NETWORK_TESTS: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}

    windows:
        name: Build and test the Windows app
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core -> ../build/cargo
            - name: Build
              shell: cmd
              run: scripts\win-build.cmd
            - uses: actions/upload-artifact@v7
              with:
                  name: InboxClassic-win-x64
                  path: build/InboxClassic.exe
                  if-no-files-found: error
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: core/e2e/package-lock.json
            - name: ImapKit for the UI test
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            # a screen wider than the runner's 1024x768, so the main window's screenshots (the homepage's) are whole
            - name: Screen resolution
              shell: powershell
              continue-on-error: true
              run: |
                  Set-DisplayResolution -Width 1920 -Height 1080 -Force
                  Add-Type -AssemblyName System.Windows.Forms
                  [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            # the app driven through its windows against ImapKit: account form, sync, reading, reply, help
            - name: UI end-to-end test
              shell: powershell
              run: scripts\ui-e2e.ps1
            - name: Every feature shown
              run: node scripts/feature-map.mjs build/ui-e2e --check windows
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: ui-e2e
                  path: |
                      build/ui-e2e/*.png
                      build/ui-e2e/log.txt
                  if-no-files-found: ignore

    mac:
        name: Build and test the Mac app
        runs-on: macos-26
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core -> ../build/cargo
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: core/e2e/package-lock.json
            # the icons of the bundle are drawn from the SVGs
            - run: brew install librsvg
            - name: ImapKit for the UI test
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            # the app built with its UI test, which drives its windows against ImapKit, screenshots of each step
            - name: Build and UI end-to-end test
              run: scripts/mac-ui-e2e.sh
            - name: Boot test
              run: '"build/mac/Inbox Classic.app/Contents/MacOS/Inbox Classic" --version'
            # every feature has its screenshot, or is listed as not there yet on the Mac
            - name: Every feature shown
              run: node scripts/feature-map.mjs build/ui-e2e-mac --check mac
            - name: The page of the screenshots
              if: always()
              run: node scripts/feature-map.mjs build/ui-e2e-mac build/feature-map-mac.html
            - name: The app, signed ad hoc
              run: ditto -c -k --keepParent "build/mac/Inbox Classic.app" build/InboxClassic-mac.zip
            - uses: actions/upload-artifact@v7
              with:
                  name: InboxClassic-mac-arm64
                  path: build/InboxClassic-mac.zip
                  if-no-files-found: error
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: ui-e2e-mac
                  path: |
                      build/ui-e2e-mac/*.png
                      build/ui-e2e-mac/log.txt
                      build/feature-map-mac.html
                  if-no-files-found: ignore

    linux:
        name: Build and test the Linux app
        runs-on: ubuntu-latest
        # the base of linux/Dockerfile, so CI and scripts/linux-*.sh build in the same system
        container: ubuntu:26.04
        timeout-minutes: 45
        defaults:
            run:
                working-directory: linux
        steps:
            - name: Packages (as linux/Dockerfile installs them)
              working-directory: /
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      build-essential pkg-config ca-certificates curl xz-utils git dpkg-dev \
                      libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libdbus-1-dev \
                      xvfb xauth dbus dbus-x11 at-spi2-core gnome-keyring libsecret-tools \
                      fonts-dejavu-core fonts-cantarell adwaita-icon-theme
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: linux
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-deb@3.8.0
            - run: cargo fmt --check
            - run: cargo clippy --locked --all-targets -- -D warnings
            - run: cargo clippy --locked --all-targets --features e2e -- -D warnings
            - run: cargo test --locked
            - run: cargo build --release --locked
            - name: The .deb
              run: |
                  node ../scripts/notices.mjs --linux ../build/linux-notices
                  cargo run --release --locked --example yelp-help -- ../build/linux-help
                  cargo deb --no-build --locked --output ../dist/InboxClassic-amd64.deb
                  dpkg-deb --info ../dist/InboxClassic-amd64.deb
                  target/release/inbox-classic --version
            - uses: actions/upload-artifact@v7
              with:
                  name: InboxClassic-linux-amd64
                  path: dist/InboxClassic-amd64.deb
                  if-no-files-found: error
            - name: ImapKit for the UI test
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            # the app driven through its widgets against ImapKit under Xvfb, screenshots of each step
            - name: UI end-to-end test
              run: |
                  cargo build --locked --features e2e
                  ../scripts/linux-ui-e2e-run.sh target/debug/inbox-classic ../build/ui-e2e-linux
            - name: Every feature shown
              working-directory: .
              run: node scripts/feature-map.mjs build/ui-e2e-linux --check linux
            - name: The page of the screenshots
              if: always()
              working-directory: .
              run: node scripts/feature-map.mjs build/ui-e2e-linux build/feature-map-linux.html
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: ui-e2e-linux
                  path: |
                      build/ui-e2e-linux/*.png
                      build/ui-e2e-linux/log.txt
                      build/feature-map-linux.html
                  if-no-files-found: ignore

    # the Linux app on Arch, whose GTK, libadwaita and WebKitGTK run ahead of Ubuntu's: the UI end-to-end test, and
    # the package of linux/arch/PKGBUILD, which Omarchy's package repository builds from each release
    arch:
        name: Build and test on Arch Linux
        runs-on: ubuntu-latest
        container: archlinux:latest
        timeout-minutes: 60
        # a rolling distribution can break this on its own schedule; not required until it has proven steady
        continue-on-error: true
        defaults:
            run:
                working-directory: linux
        steps:
            - name: Packages
              working-directory: /
              run: |
                  pacman -Syu --noconfirm --needed \
                      base-devel git rust nodejs npm namcap pkgconf \
                      gtk4 libadwaita webkitgtk-6.0 glib2-devel \
                      xorg-server-xvfb xorg-xauth dbus at-spi2-core gnome-keyring libsecret \
                      ttf-dejavu cantarell-fonts adwaita-icon-theme
            - uses: actions/checkout@v6
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: linux
                  key: arch
            - name: ImapKit for the UI test
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            - name: UI end-to-end test
              run: |
                  cargo build --locked --features e2e
                  ../scripts/linux-ui-e2e-run.sh target/debug/inbox-classic ../build/ui-e2e-arch
            - name: Every feature shown
              working-directory: .
              run: node scripts/feature-map.mjs build/ui-e2e-arch --check linux
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: ui-e2e-arch
                  path: |
                      build/ui-e2e-arch/*.png
                      build/ui-e2e-arch/log.txt
                  if-no-files-found: ignore
            # makepkg from a tarball of the checkout under the release tarball's name, so it downloads nothing, with the
            # crates rust-cache restored (scripts/arch-makepkg.sh, which scripts/arch-package.sh runs too)
            - name: The package
              working-directory: .
              run: |
                  git config --global --add safe.directory "$PWD"
                  version=$(sed -n 's/^pkgver=\([0-9.]*\).*/\1/p' linux/arch/PKGBUILD)
                  mkdir /tmp/pkg
                  cp linux/arch/PKGBUILD /tmp/pkg/
                  git archive --prefix "inbox-classic-$version/" -o "/tmp/pkg/inbox-classic-$version.tar.gz" HEAD
                  CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" scripts/arch-makepkg.sh /tmp/pkg --install

    fuzz:
        name: Fuzz the parsers
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core/fuzz
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@nightly
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core/fuzz
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz
            # the corpus grows from run to run instead of starting empty every time
            - uses: actions/cache@v4
              with:
                  path: core/fuzz/corpus
                  key: fuzz-corpus-${{ github.run_id }}
                  restore-keys: fuzz-corpus-
            - name: Run every target for a minute
              run: |
                  # a failing `cargo fuzz list` inside the for line would not fail the step. The prebuilt
                  # cargo-fuzz is a musl binary and would default to that target, which ASan does not support
                  targets=$(cargo fuzz list)
                  test -n "$targets"
                  for target in $targets; do
                      cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60 -rss_limit_mb=2048
                  done
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: fuzz-artifacts
                  path: core/fuzz/artifacts

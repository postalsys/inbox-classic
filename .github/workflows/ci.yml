name: CI

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Rust formatting and lints
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: core
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets --locked -- -D warnings
            # the C header is generated by the build, a stale committed copy fails here
            - name: C header is up to date
              run: git diff --exit-code -- include

    test:
        name: Rust tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core
        env:
            # the end-to-end tests against ImapKit must run here, not skip
            PE_E2E_REQUIRED: '1'
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: core/e2e/package-lock.json
            - name: ImapKit for the end-to-end tests
              run: npm ci --no-audit --no-fund
              working-directory: core/e2e
            - run: cargo test --workspace --locked

    windows:
        name: Build the Windows app
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core -> ../build/cargo
            - name: Build
              shell: cmd
              run: scripts\win-build.cmd
            - uses: actions/upload-artifact@v7
              with:
                  name: PostalExpress-win-x64
                  path: build/PostalExpress.exe
                  if-no-files-found: error

    fuzz:
        name: Fuzz the parsers
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        defaults:
            run:
                working-directory: core/fuzz
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@nightly
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core/fuzz
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz
            # the corpus grows from run to run instead of starting empty every time
            - uses: actions/cache@v4
              with:
                  path: core/fuzz/corpus
                  key: fuzz-corpus-${{ github.run_id }}
                  restore-keys: fuzz-corpus-
            - name: Run every target for a minute
              run: |
                  # a failing `cargo fuzz list` inside the for line would not fail the step. The prebuilt
                  # cargo-fuzz is a musl binary and would default to that target, which ASan does not support
                  targets=$(cargo fuzz list)
                  test -n "$targets"
                  for target in $targets; do
                      cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60 -rss_limit_mb=2048
                  done
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: fuzz-artifacts
                  path: core/fuzz/artifacts

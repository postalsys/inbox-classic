on:
    push:
        branches:
            - master

permissions: {}

name: Manage Release

# release-please opens or updates the release PR on every push to master. Merging it drafts the release and pushes
# its tag (force-tag-creation, GitHub withholds the tag of a draft otherwise). Nothing is published here: the signed
# installer is built and uploaded from the release Mac with scripts/release.sh, which then publishes the draft, so
# nobody sees a version whose installer does not exist yet.
jobs:
    release_please:
        name: Create or prepare release
        runs-on: ubuntu-latest
        permissions:
            # the release PR, the tag and the draft release
            contents: write
            pull-requests: write
        steps:
            # configured through release-please-config.json, only the config file can set `draft`
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
            # the release PR changes the version in core/Cargo.toml, and Cargo.lock lists every crate of the workspace
            # with it: the Windows build runs with --locked, so the PR's lock file follows
            - if: ${{ steps.release.outputs.pr }}
              uses: actions/checkout@v6
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
            - if: ${{ steps.release.outputs.pr }}
              working-directory: core
              run: |
                  cargo update --workspace
                  if ! git diff --quiet Cargo.lock; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git commit -m "chore: update Cargo.lock for the release" Cargo.lock
                      git push
                  fi
